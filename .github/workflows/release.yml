name: Release extension

# Push a tag like v0.1.0 to build the extension and attach the zip to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/extension
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Typecheck
        working-directory: apps/extension
        run: npx tsc --noEmit

      - name: Build and zip
        run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: cv-trial-extension
          path: apps/extension/.output/cv-trial-extension-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/extension/.output/cv-trial-extension-*.zip
          generate_release_notes: true
          body: |
            ## Install
            1. Download **cv-trial-extension-${{ github.ref_name }}.zip** below and unzip it.
            2. Open `chrome://extensions` and turn on **Developer mode** (top right).
            3. Click **Load unpacked** and select the unzipped `cv-trial-extension` folder.
            4. Pin CV Trial from the puzzle-piece menu, open a clothing product page, and click the icon.
